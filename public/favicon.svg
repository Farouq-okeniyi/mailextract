<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="mailExtractGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#4f46e5" />
    </linearGradient>
  </defs>

  <!-- Rounded App Background -->
  <rect width="512" height="512" rx="128" fill="url(#mailExtractGrad)" />

  <!-- 4-Box Dashboard Grid Logo -->
  <g fill="#ffffff">
    <!-- Top-Left Tall Box -->
    <rect x="110" y="110" width="126" height="162" rx="24" />
    <!-- Bottom-Left Short Box -->
    <rect x="110" y="302" width="126" height="100" rx="24" />
    <!-- Top-Right Short Box -->
    <rect x="266" y="110" width="126" height="100" rx="24" />
    <!-- Bottom-Right Tall Box -->
    <rect x="266" y="240" width="126" height="162" rx="24" />
  </g>
</svg>